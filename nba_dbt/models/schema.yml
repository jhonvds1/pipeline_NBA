version: 2

models:
  - name: stg_player_gamelogs
    columns:
      - name: player_id
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null

  - name: stg_team_gamelogs
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: game_id
        data_tests:
          - not_null

  - name: stg_team_details
    columns:
      - name: team_id
        data_tests:
          - not_null
          - unique